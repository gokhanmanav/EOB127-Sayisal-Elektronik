<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenciye Özel Mantık Fonksiyonu</title>
    
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; background-color: #f0f2f5; }
        .container { max-width: 700px; margin: 50px auto; padding: 30px; background-color: #fff; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #004085; text-align: center; margin-bottom: 25px; }
        .input-group { text-align: center; margin-bottom: 30px; }
        .input-group label { font-size: 1.1em; font-weight: bold; margin-right: 15px; }
        .input-group input { padding: 10px; border: 2px solid #ced4da; border-radius: 5px; width: 200px; font-size: 1em; text-align: center; }
        .result-box { border: 2px solid #007bff; border-radius: 5px; padding: 20px; text-align: center; min-height: 80px; }
        .result-box p { margin: 0; font-size: 1.2em; font-weight: bold; }
        .formula-display { font-size: 1.5em; color: #dc3545; }
        .karno-placeholder { margin-top: 30px; padding-top: 20px; border-top: 1px dashed #ccc; }
        .karno-placeholder h2 { text-align: center; color: #333; }
        
    </style>
</head>
<body>

<div class="container">
    <h1>Öğrenciye Özel Mantık Devresi Formülasyonu</h1>
    
    <div class="input-group">
        <label for="ogrenciNoInput">Öğrenci Numarası:</label>
        <input type="number" id="ogrenciNoInput" placeholder="Örn: 24330127" oninput="calculateProblem()">
    </div>

    <div class="result-box">
        <p>Size Atanan Fonksiyon $F(A, B, C, D)$:</p>
        <div class="formula-display" id="formulaOutput">
            $$F(A, B, C, D) = \text{Numaranızı Giriniz...}$$
        </div>
    </div>
    
    <div class="karno-placeholder">
        <h2>Göreviniz: Karno Haritasını Doldurma ve Sadeleştirme</h2>
        <p>Yukarıdaki fonksiyonu kullanarak Karno Haritasını doldurunuz ve en sade halini bulunuz.</p>
        </div>
</div>

<script>
    function calculateProblem() {
        const ogrenciNo = document.getElementById('ogrenciNoInput').value;
        const formulaOutput = document.getElementById('formulaOutput');
        
        if (!ogrenciNo || ogrenciNo.length < 3) {
            formulaOutput.innerHTML = '$$F(A, B, C, D) = \\text{Geçerli bir numara giriniz.}$$';
            if (window.MathJax) MathJax.typeset();
            return;
        }

        const siraNoStr = ogrenciNo.slice(-3);
        const S = parseInt(siraNoStr, 10);

        const K = (S % 5) + 5; 
        const B = S % 16;
        const A = (S % 4) + 1;

        let minterms = new Set();
        let i = 0;
        let counter = 0;

        while (minterms.size < K && counter < 100) { 
            const Mi = (B + i * A) % 16;
            minterms.add(Mi);
            i++;
            counter++;
        }
        
        const sortedMinterms = Array.from(minterms).sort((a, b) => a - b);
        const mintermList = sortedMinterms.join(', ');

        let operator, label, formula;
        
        if (S % 2 === 0) {
            operator = '\\sum m';
            label = 'Minterm Toplamı';
        } else {
            operator = '\\prod M';
            label = 'Maksterm Çarpımı';
        }

        formula = `$$F(A, B, C, D) = ${operator} (${mintermList})$$`;
        
        formulaOutput.innerHTML = formula;

        if (window.MathJax) {
            MathJax.typesetPromise([formulaOutput]);
        }
    }
    
    window.addEventListener('load', () => {
        if (window.MathJax) {
            MathJax.typeset();
        }
    });

</script>

</body>
</html>
